name: YAML Format Check

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  yamlfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      
      - name: Install yamlfmt
        run: go install github.com/google/yamlfmt/cmd/yamlfmt@latest
      
      - name: Run yamlfmt
        run: yamlfmt .
